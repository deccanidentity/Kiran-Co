<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- Original abstract architectural illustration for Kiran & Co. Palette: Espresso, Soft Taupe, Warm Cream, White. -->
  <rect width="600" height="600" fill="#A88C75" fill-opacity="0.16"/>
  <g stroke="#A88C75" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="2 7">
    <line x1="90" y1="30" x2="90" y2="520"/>
    <line x1="210" y1="30" x2="210" y2="520"/>
    <line x1="330" y1="30" x2="330" y2="520"/>
    <line x1="450" y1="30" x2="450" y2="520"/>
    <line x1="30" y1="90" x2="570" y2="90"/>
    <line x1="30" y1="210" x2="570" y2="210"/>
  </g>
  <circle cx="170" cy="170" r="74" fill="none" stroke="#A88C75" stroke-width="1.5"/>
  <circle cx="170" cy="170" r="48" fill="#A88C75" fill-opacity="0.4"/>
  <!-- cast shadow -->
  <polygon points="330,520 480,520 562,578 412,578" fill="#30272A" fill-opacity="0.14"/>
  <polygon points="110,520 310,520 372,556 172,556" fill="#A88C75" fill-opacity="0.28"/>
  <!-- tall slab -->
  <rect x="330" y="90" width="150" height="430" fill="#30272A"/>
  <rect x="320" y="90" width="170" height="14" fill="#30272A"/>
  <g stroke="#F7F3EF" stroke-opacity="0.16" stroke-width="1.5">
    <line x1="362" y1="120" x2="362" y2="520"/>
    <line x1="392" y1="120" x2="392" y2="520"/>
    <line x1="422" y1="120" x2="422" y2="520"/>
    <line x1="452" y1="120" x2="452" y2="520"/>
  </g>
  <!-- low taupe block -->
  <rect x="480" y="350" width="72" height="170" fill="#A88C75"/>
  <g stroke="#F7F3EF" stroke-opacity="0.5" stroke-width="1.5">
    <line x1="480" y1="400" x2="552" y2="400"/>
    <line x1="480" y1="450" x2="552" y2="450"/>
  </g>
  <!-- arch -->
  <path d="M110 520 V330 A100 100 0 0 1 310 330 V520 Z" fill="#A88C75" fill-opacity="0.6"/>
  <path d="M142 520 V336 A68 68 0 0 1 278 336 V520 Z" fill="#F7F3EF"/>
  <path d="M142 520 V336 A68 68 0 0 1 278 336" fill="none" stroke="#30272A" stroke-width="1.5"/>
  <!-- white block -->
  <rect x="36" y="410" width="74" height="110" fill="#FFFFFF" stroke="#A88C75" stroke-opacity="0.7"/>
  <g stroke="#A88C75" stroke-opacity="0.7" stroke-width="1">
    <line x1="73" y1="410" x2="73" y2="520"/>
    <line x1="36" y1="465" x2="110" y2="465"/>
  </g>
  <line x1="24" y1="520" x2="576" y2="520" stroke="#30272A" stroke-width="2"/>
</svg>
